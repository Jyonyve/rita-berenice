app = "rita-berenice"
primary_region = "sin"

[build]
dockerfile = "Dockerfile"

  [build.args]
  CHROMA_HOST = "chromadb-flyio.fly.dev"
  CHROMA_PORT = "443"  # HTTPS port
  CHROMA_SSL = "true"  # Enable SSL for public access
  VITE_API_DOMAIN = "https://rita-berenice.fly.dev"
  VITE_APP_DOMAIN = "https://rita-berenice.fly.dev"
  VITE_APP_ENV = "production"
  VITE_SUPERTOKENS_DOMAIN = "https://st-dev-f9ec6d80-57af-11f0-a145-0bca7824da16.aws.supertokens.io"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 3_000
min_machines_running = 0
processes = [ "app" ]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1_024