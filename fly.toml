# fly.toml for the rita-berenice application

app = 'rita-berenice'
primary_region = 'sin' # Or your preferred region

[build]
  # This line is crucial: it tells Fly.io to use your Dockerfile
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0 # Set to 1 for production if you want it always on
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
