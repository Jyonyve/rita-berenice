# fly.toml app configuration file generated for chromadb-flyio on 2025-07-04T11:41:36+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chromadb-flyio'
primary_region = 'sin'

[build]
# 공식 ChromaDB의 최신 안정화 버전을 명시적으로 지정합니다.
image = "chromadb/chroma:1.0.12"

[env]
  IS_PERSISTENT = 'TRUE'
  PERSIST_DIRECTORY = '/data'

[[mounts]]
  source = 'chromadb_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
