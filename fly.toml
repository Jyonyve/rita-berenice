app = 'rita-berenice'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[build.args]
  VITE_APP_DOMAIN = "https://rita-berenice.fly.dev"
  VITE_API_DOMAIN = "https://rita-berenice.fly.dev"
  VITE_SUPERTOKENS_DOMAIN = "https://st-dev-f9ec6d80-57af-11f0-a145-0bca7824da16.aws.supertokens.io"
  VITE_APP_ENV = "production"
  CHROMA_HOST = "chromadb-flyio.internal"
  CHROMA_PORT = "8000"
  CHROMA_SSL = "false"
  CHROMA_SERVER_CORS_ALLOW_ORIGINS = "https://rita-berenice.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
