# rita-berenice/fly.toml

app = "rita-berenice"
primary_region = "sin"

[build]
dockerfile = "Dockerfile"
 [build.args]
  VITE_API_DOMAIN = "https://rita-berenice.fly.dev"
  VITE_APP_DOMAIN = "https://rita-berenice.fly.dev"
  VITE_APP_ENV = "production"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 3000
min_machines_running = 0
processes = ["app"]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024
