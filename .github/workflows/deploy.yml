# Simple workflow for deploying static content to GitHub Pages
name: Rita-berenice Static Site to GitHub Pages

on:
 # Runs on pushes targeting your main and develop branches
 push:
  branches:
   - 'mock' # Or any other branches you want to deploy from

 # Allows you to run this workflow manually from the Actions tab
 workflow_dispatch:

# Sets GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
 contents: read
 pages: write
 id-token: write

# Allow only one concurrent deployment
concurrency:
 group: 'pages'
 cancel-in-progress: true

jobs:
 # Build and deploy job
 deploy:
  environment:
   name: github-pages
   url: ${{ steps.deployment.outputs.page_url }}
  runs-on: ubuntu-latest
  steps:
   - name: Checkout
     uses: actions/checkout@v4

   # --- ADD THIS STEP ---
   - name: Install pnpm
     uses: pnpm/action-setup@v4

   - name: Set up Node.js
     uses: actions/setup-node@v4
     with:
      node-version: 22
      cache: 'pnpm' # This tells setup-node to use pnpm's cache

   - name: Install Dependencies (Client-Side Only)
     run: pnpm install --no-optional

   - name: Create .env.static from GitHub Variables
     run: |
      echo "VITE_APP_MODE=${{ vars.VITE_APP_MODE }}" > .env.static
      echo "VITE_API_DOMAIN=${{ vars.VITE_API_DOMAIN }}" >> .env.static
      echo "VITE_APP_DOMAIN=${{ vars.VITE_APP_DOMAIN }}" >> .env.static

   - name: Build Static Site
     run: pnpm run build:static # This command will now use the generated .env.static

   - name: Setup Pages
     uses: actions/configure-pages@v5

   - name: Upload artifact
     uses: actions/upload-pages-artifact@v3
     with:
      path: './dist/static'

   - name: Deploy to GitHub Pages
     id: deployment
     uses: actions/deploy-pages@v4
