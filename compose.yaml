services:
 postgres:
  image: pgvector/pgvector:pg17
  environment:
   POSTGRES_DB: rita_berenice
   POSTGRES_USER: rita
   POSTGRES_PASSWORD: rita
  ports:
   - '5432:5432'
  healthcheck:
   test: ['CMD-SHELL', 'pg_isready -U rita -d rita_berenice']
   interval: 5s
   timeout: 5s
   retries: 10
  volumes:
   - postgres-data:/var/lib/postgresql/data

volumes:
 postgres-data:
